server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version
    server_tokens off;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve HTML pages without aggressive caching
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (CSS, JS, images, fonts, videos)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Support both /page.html and /page URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Block hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
    }
}
